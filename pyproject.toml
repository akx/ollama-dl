[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "ollama-dl"
version = "0.2.0"
description = "Download models from an Ollama registry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx2>=2.10.0",
    "rich>=13.8.1",
]

[project.scripts]
ollama-dl = "ollama_dl:main"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.uv.build-backend]
module-name = "ollama_dl"
module-root = ""

[tool.ruff.lint]
extend-select = [
    "ANN",
    "COM812",
    "E",
    "F",
    "I",
    "W",
]
ignore = [
    "D",
    "EM102",
    "PLR0913",
    "TRY003",
]
